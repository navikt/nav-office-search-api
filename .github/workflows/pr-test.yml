name: Test pull request
on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    with:
      push-image: false
    secrets: inherit

  update-lockfile:
    if: github.actor == 'dependabot[bot]'
    uses: navikt/navno-ci/.github/workflows/dependabot-lockfile.yml@v1
    permissions:
      contents: write
    secrets: inherit
