name: Deploy to prod
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/node-build.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      image-suffix: prod
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: prod-fss
      resource: .nais/config.prod.yaml
      var: image=${{ needs.build.outputs.image }}

  # Prod only, so dev doesn't page the team channel
  alerts:
    needs: deploy
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: prod-fss
      resource: .nais/alerts.yaml

  release:
    needs: [build, deploy]
    uses: navikt/navno-ci/.github/workflows/release.yml@v1
    permissions: { contents: write }
    with:
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
