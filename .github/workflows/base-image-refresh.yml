# Rebuilds and redeploys prod weekly so the image gets the newest base image.
name: Refresh base image
on:
  schedule:
    - cron: '17 23 * * 0' # Sunday 23:17, off the hour due to quirks with GitHub scheduling
      timezone: Europe/Oslo
  workflow_dispatch:

jobs:
  deploy:
    name: Rebuild and deploy to prod
    # "Run workflow" lets you pick a branch. Skip unless it's main, so a manual
    # run can't put a feature branch in prod.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build and deploy to prod
        uses: ./.github/actions/build-and-deploy
        with:
          environment: prod
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
