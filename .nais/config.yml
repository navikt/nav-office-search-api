---
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: nav-office-search-api
  namespace: navno
  labels:
    team: navno
spec:
  image: {{image}}
  port: 3003
  liveness:
    path: /internal/isAlive
    initialDelay: 5
  readiness:
    path: /internal/isReady
    initialDelay: 5
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  ingresses:
  {{#each ingresses as |ingress|}}
    - {{ingress}}
  {{/each}}
  env:
    - name: NODE_EXTRA_CA_CERTS
      value: "/etc/ssl/ca-bundle.pem"
    - name: NORG2_ORIGIN
      value: {{norg2Origin}}
    - name: PDL_ORIGIN
      value: {{pdlOrigin}}
    - name: PDL_TOKEN_TARGET
      value: {{pdlTokenTarget}}
  webproxy: true
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: nav-office-search
          namespace: navno
          cluster: {{frontendCluster}}
      {{#if tokenxTokenGenerator}}
        - application: tokenx-token-generator
          namespace: nais
          cluster: {{cluster}}
      {{/if}}
    outbound:
      rules:
        - application: pdl-api
          namespace: pdl
          cluster: {{cluster}}
  replicas:
  {{#with replicas}}
    min: {{min}}
    max: {{max}}
  {{/with}}
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
