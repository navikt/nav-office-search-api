# Only the signals nav-office-search (the frontend) can't see. User-facing failures, including
# PDL being down, alert there; the metrics here are for diagnosing them. It passes the answers on
# unread, so whether the searches find anything is one of the signals it can't see.
# No double curly braces in this file, not even in comments: nais deploy templates every resource with Handlebars.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nav-office-search-api-alerts
  namespace: navno
  labels:
    team: navno
spec:
  groups:
    - name: nav-office-search-api
      rules:
        # Our office reference data's daily load can fail while the pods stay ready with the data
        # from before, so nothing user-facing fires as a problem. The data rarely changes, so a couple of days is fine.
        # min() is used so a pod that loads doesn't hide one that doesn't.
        # A pod that has never loaded exports 0, which is stale too.
        - alert: NavOfficeSearchApiDataStale
          expr: time() - min(nav_office_search_api_data_last_success_timestamp_seconds) > 2 * 86400
          for: 1h
          annotations:
            summary: A nav-office-search-api pod has no reference data from the last 2 days
            consequence: Its searches are answered from old postnumre, kommuner, bydeler and offices. A pod that has never loaded is not ready, and answers none.
            action: Check the logs for "Loading data failed". The error with it names the source that failed, or the dataset that came out too small. nav_office_search_api_upstream_requests_total has norg and xp. Restarting the pods triggers a new load.
          labels:
            namespace: navno
            severity: warning

        - alert: NavOfficeSearchApiKommunerWithoutOffice
          expr: max(nav_office_search_api_reference_data_without_office{dataset="kommuner"}) > 0
          for: 30m
          annotations:
            summary: Some kommuner have no Nav office in nav-office-search-api's reference data
            consequence: Searches for a postnummer or a name in those kommuner find no office.
            action: The log line "Areas are missing an office" with dataset kommuner has their numbers. "Offices without a page in XP" and "Offices without areas in NORG" say what the sources lack. After a kommune change, run "Refresh base image and data files" for a new register. A fix in NORG or XP is read by the next load at 05:00 UTC, or when the pods restart.
          labels:
            namespace: navno
            severity: warning

        # PDL failures via our token, our access, or our query.
        # The frontend sees failed searches, but not the root cause.
        # PDL being down is a server_error, a 5xx, or a timeout - and isn't included.
        - alert: NavOfficeSearchApiPdlRejectingRequests
          expr: |
            sum(increase(nav_office_search_api_pdl_errors_total{code!="server_error"}[15m])) > 5
            or
            sum(increase(nav_office_search_api_upstream_requests_total{upstream="pdl",status="4xx"}[15m])) > 5
          for: 5m
          annotations:
            summary: PDL is refusing nav-office-search-api's requests
            consequence: Address searches, and postnummer searches in kommuner with bydeler, answer an error.
            action: nav_office_search_api_pdl_errors_total says which code. unauthenticated and unauthorized are the token or the access to pdl-api (PDL_TOKEN_TARGET and accessPolicy), bad_request is our query. The log line "PDL request failed" has the status and the codes.
          labels:
            namespace: navno
            severity: warning

        # Health signal: searches find something during the day. The frontend can't tell a hit from an
        # empty answer, and its error alert can't fire without traffic.
        # "or vector(0)" covers no pod being scraped at all. hour() and day_of_week() are UTC, so 08-15 is 09-16 Oslo-time in winter and 10-17 in summer (always inside 09-17). Weekdays only (1-5): weekend traffic is too sparse to expect a hit every hour.
        - alert: NavOfficeSearchApiNoSuccessfulSearches
          expr: |
            (sum(increase(nav_office_search_api_lookups_total{operation="search",result="hits"}[1h])) or vector(0)) == 0
            and on() hour() >= 8 and on() hour() < 15
            and on() day_of_week() >= 1 and on() day_of_week() <= 5
          for: 30m
          annotations:
            summary: No search has found an office or an address for over 1.5 hours during the day
            consequence: The search at www.nav.no/finn-nav-kontor may be down, unreachable or broken for users, or these pods no longer scraped. The frontend's error alert can't fire without traffic.
            action: Try https://www.nav.no/finn-nav-kontor yourself. If it fails, nav_office_search_upstream_requests_total in the frontend says whether its searches get here, and with what answer. If it works, check that the pods here are running and being scraped. Searches that only come up empty are counted with result="empty", and point at the reference data.
          labels:
            namespace: navno
            severity: warning
